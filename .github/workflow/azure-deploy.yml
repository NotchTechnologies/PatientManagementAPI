
name: DotNet API - Azure CI CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_PATH: './PatientManagement.sln'
  PROJECT_PATH: './PatientManagement/PatientManagementAPI.csproj'
  AZURE_WEBAPP_NAME: 'PatientManagement'
jobs:

  # CONTINUOUS INTEGRATION
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Packages
        run: dotnet restore "${{ ./PatientManagement.sln }}"

      - name: Build Solution
        run: |
          dotnet build "${{./PatientManagement.sln  }}" \
            --configuration Release \
            --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test "${{ ./PatientManagement.sln  }}" \
            --configuration Release \
            --no-build

      - name: Publish API
        if: github.event_name != 'pull_request'
        run: |
          dotnet publish "${{ ./PatientManagement.sln   }}" \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Upload Deployment Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish/

  # CONTINUOUS DEPLOYMENT
  deploy:
    name: Deploy to Azure
    needs: build-and-test

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Published Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Web API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.PatientmangementAPI }}  
          package: ./publish
